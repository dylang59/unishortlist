<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCAS Course Search</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel2:#1b2029; --line:#262d39;
    --text:#e6e9ef; --dim:#98a2b3; --accent:#5b9dff; --accent2:#2bd4a4;
    --warn:#ffb020; --radius:8px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    position:sticky;top:0;background:var(--bg);z-index:20}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  h1 span{color:var(--accent)}
  .grow{flex:1}
  input,select,button{font:inherit;color:var(--text);background:var(--panel2);
    border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  button{cursor:pointer;background:var(--panel2)}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:650}
  button.primary:disabled{opacity:.5;cursor:default}
  #q{min-width:230px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .bar label{color:var(--dim);font-size:12px;margin-right:-4px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;
    padding:3px 10px;font-size:12px;color:var(--dim);white-space:nowrap}
  .chip b{color:var(--text)}
  .note{padding:9px 18px;background:#2a2113;border-bottom:1px solid #4a3a1b;
    color:#f0cf95;font-size:12.5px}
  .note b{color:var(--warn)}
  main{padding:0 0 60px;transition:padding-right .18s ease}
  main.split{padding-right:var(--panelw)}
  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:0;background:var(--panel);text-align:left;
    font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);
    padding:6px 9px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;
    white-space:nowrap;z-index:5}
  thead th:hover{color:var(--text)}
  thead th.sorted{color:var(--accent)}
  /* Compact rows: one line each, so more courses fit above the fold and the
     side panel carries the detail that used to need a second line. */
  tbody td{padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:middle;
    font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--panel)}
  tbody tr.sel{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
  .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  td.c-title{max-width:38vw}
  main.split td.c-title{max-width:22vw}
  td.c-prov{max-width:16vw}
  .sub{color:var(--dim);font-size:12px;margin-top:2px}
  .prov{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* The UCAS link is always visible, not hidden behind a row expansion —
     it is the main reason to use this table at all. */
  td.c-link{width:1%;text-align:center;padding:0 6px}
  a.ext{display:inline-block;padding:2px 5px;border-radius:4px;color:var(--dim);
    font-size:13px;line-height:1.1;text-decoration:none}
  a.ext:hover{color:var(--accent);background:var(--panel2);text-decoration:none}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);
    border-radius:4px;padding:1px 6px;font-size:11px;color:var(--dim);margin:1px 3px 1px 0}
  .tar{color:var(--accent2);font-weight:650;white-space:nowrap}
  .tar.prev{color:#7fa8c9;font-weight:500;opacity:.85}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .empty{padding:40px 18px;color:var(--dim);text-align:center}
  .load{padding:14px 18px;color:var(--dim)}
  .prog{height:3px;background:var(--accent);width:0;transition:width .25s;
    position:fixed;top:0;left:0;z-index:50}
  td.mini{font-size:12px;color:var(--dim);white-space:nowrap}

  /* ---- Side panel ----------------------------------------------------
     UCAS sends x-frame-options: SAMEORIGIN and a Cloudflare challenge, so
     their page cannot be embedded. The panel renders the data we already
     hold instead, which is faster to browse and never shows a captcha. */
  :root{ --panelw:min(460px, 42vw); }
  #panel{position:fixed;top:0;right:0;bottom:0;width:var(--panelw);
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .18s ease;box-shadow:-12px 0 32px rgba(0,0,0,.35)}
  #panel.open{transform:none}
  #panel .ph{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  #panel .pb{padding:14px 16px 28px;overflow-y:auto;flex:1}
  #panel h2{margin:0 26px 3px 0;font-size:15.5px;line-height:1.3;font-weight:650}
  #panel .pprov{color:var(--accent);font-size:12.5px;margin-bottom:9px}
  #panel .px{position:absolute;top:10px;right:11px;background:none;border:0;
    color:var(--dim);font-size:19px;line-height:1;cursor:pointer;padding:2px 6px;
    border-radius:4px}
  #panel .px:hover{color:var(--text);background:var(--panel2)}
  #panel .cta{display:block;text-align:center;background:var(--accent);
    color:#07101f;font-weight:650;font-size:13px;padding:8px;border-radius:6px;
    text-decoration:none}
  #panel .cta:hover{filter:brightness(1.1);text-decoration:none}
  #panel .cta2{display:block;text-align:center;border:1px solid var(--line);
    color:var(--dim);font-size:12.5px;padding:6px;border-radius:6px;margin-top:7px;
    text-decoration:none}
  #panel .cta2:hover{color:var(--text);border-color:var(--dim);text-decoration:none}
  /* Label/value grid — reads as a spec sheet rather than a paragraph. */
  .kv{display:grid;grid-template-columns:86px 1fr;gap:7px 12px;font-size:12.5px}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0;color:var(--text)}
  .big{font-size:21px;font-weight:650;color:var(--accent2);line-height:1.1}
  .big.prev{color:#7fa8c9;font-weight:600}
  .biglab{color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:3px}
  .pbox{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:11px 13px;margin-bottom:14px}
  .psec{color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;margin:0 0 7px}
  .nav{display:flex;gap:6px;align-items:center;margin-top:11px}
  .nav button{flex:1;background:var(--panel2);border:1px solid var(--line);
    color:var(--dim);border-radius:5px;padding:5px;cursor:pointer;font-size:12px}
  .nav button:hover:not(:disabled){color:var(--text);border-color:var(--dim)}
  .nav button:disabled{opacity:.4;cursor:default}
  .nav .pos{color:var(--dim);font-size:11.5px;white-space:nowrap}
  @media (max-width:820px){
    :root{ --panelw:100vw; }
    main.split{padding-right:0}
  }

  /* Provider picker */
  .combo{position:relative;display:inline-block}
  .combo input{padding-right:24px}
  .combo .clear{position:absolute;right:2px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--dim);font-size:16px;line-height:1;
    padding:2px 6px;cursor:pointer}
  .combo .clear:hover{color:var(--text)}
  .menu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;
    min-width:340px;max-height:320px;overflow-y:auto;
    background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .menu .opt{padding:7px 10px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
  .menu .opt:hover,.menu .opt.active{background:#243044}
  .menu .opt .nm{flex:1;min-width:0}
  .menu .opt .ct{color:var(--dim);font-size:11.5px;white-space:nowrap}
  .menu .opt .alias{display:block;color:var(--dim);font-size:11px;margin-top:1px}
  .menu .none{padding:10px;color:var(--dim);font-size:12.5px}
  .menu mark{background:rgba(91,157,255,.28);color:var(--text);border-radius:2px}
  .selected{border-color:var(--accent) !important}
  /* Selected universities, shown as removable chips next to the picker */
  .pchips{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center}
  .pchip{background:#243044;border:1px solid #33506f;border-radius:99px;
    padding:3px 6px 3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;
    max-width:230px}
  .pchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pchip .n{color:var(--dim);font-size:11px}
  .pchip button{background:none;border:none;color:var(--dim);cursor:pointer;
    padding:0 1px;font-size:14px;line-height:1}
  .pchip button:hover{color:#ff7b72}
  .menu .opt.picked{opacity:.45}
  .menu .opt.picked .nm::after{content:' ✓';color:var(--accent2)}
</style>
</head>
<body>
<div class="prog" id="prog"></div>

<header>
  <h1>UCAS <span>fast search</span></h1>
  <input id="q" placeholder="Course keyword (e.g. physics, law)" autocomplete="off">
  <select id="year">
    <option value="2027">2027 entry</option>
    <option value="2026">2026 entry</option>
    <option value="2025">2025 entry</option>
    <option value="">Any year</option>
  </select>
  <select id="qual">
    <option value="">Any qualification</option>
    <option value="Bach(hons)">Bachelor (Hons)</option>
    <option value="Bachelor">Bachelor (ordinary)</option>
    <option value="IMD">Integrated Masters</option>
    <option value="Fdg">Foundation degree</option>
    <option value="Foundation Year">Foundation year</option>
    <option value="Cer">Certificate (HNC/CertHE)</option>
    <option value="Dip">Diploma (HND/DipHE)</option>
  </select>
  <select id="mode">
    <option value="">Any mode</option>
    <option>Full-time</option>
    <option>Part-time</option>
  </select>
  <select id="region">
    <option value="">Anywhere</option>
    <option>Greater London</option>
    <option>South East England</option>
    <option>South West England</option>
    <option>East of England</option>
    <option>East Midlands</option>
    <option>West Midlands</option>
    <option>North West England</option>
    <option>North East England</option>
    <option>Yorkshire and the Humber</option>
    <option>Scotland</option>
    <option>Wales</option>
    <option>Northern Ireland</option>
  </select>
  <select id="depth" title="Each 100 results is one query against UCAS's search backend">
    <option value="3">Fetch 300</option>
    <option value="10">Fetch 1,000</option>
    <option value="20">Fetch 2,000</option>
    <option value="50">Fetch 5,000</option>
  </select>
  <button class="primary" id="go">Search</button>
  <a href="/export.html" style="color:var(--dim);font-size:13px;text-decoration:none;margin-left:4px">Bulk export →</a>
</header>

<div class="bar">
  <label>Refine</label>
  <div class="combo">
    <input id="fprov" placeholder="any university…" size="22" autocomplete="off"
           role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="provlist">
    <button id="fprovClear" class="clear" title="Clear all" hidden>×</button>
    <div id="provlist" class="menu" role="listbox" hidden></div>
  </div>
  <span id="provChips" class="pchips"></span>
  <input id="fsub"  placeholder="subject…" size="14">
  <input id="ftown" placeholder="town / region…" size="14">
  <label>Min tariff</label>
  <input id="ftar" type="number" placeholder="0" size="4" style="width:80px">
  <span class="grow"></span>
  <span class="chip" id="cStat">idle</span>
  <button id="csv">Export CSV</button>
</div>

<div class="note" id="note" hidden></div>
<main><div id="out" class="empty">Enter a keyword and hit Search.</div></main>

<aside id="panel" aria-label="Course detail" aria-hidden="true">
  <div class="ph">
    <button class="px" id="pclose" title="Close (Esc)">&times;</button>
    <h2 id="ptitle"></h2>
    <div class="pprov" id="pprov"></div>
    <a class="cta" id="pucas" target="_blank" rel="noopener">Open UCAS listing &nearr;</a>
    <a class="cta2" id="pweb" target="_blank" rel="noopener">University website &nearr;</a>
    <div class="nav">
      <button id="pprev" title="Previous (&uarr;)">&uarr; Prev</button>
      <span class="pos" id="ppos"></span>
      <button id="pnext" title="Next (&darr;)">Next &darr;</button>
    </div>
  </div>
  <div class="pb" id="pbody"></div>
</aside>

<script>
const $ = s => document.querySelector(s);
let ROWS = [], SORT = { key:'provider', dir:1 };

// Entry cycle is filtered by academicYearId (a plain string). Do NOT filter by
// start month: 2027 start dates mostly belong to 2026-cycle mid-year intakes.

function progress(p){ $('#prog').style.width = p + '%'; if(p>=100) setTimeout(()=>$('#prog').style.width=0,400); }

async function post(url, body){
  const r = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ('HTTP '+r.status));
  return r.json();
}

function payload(){
  const p = { studyLevel:'Undergraduate' };
  const term = $('#q').value.trim();
  if(term) p.searchTerm = term;
  const y = $('#year').value;
  if(y) p.academicYearId = y;
  if($('#qual').value) p.qualificationLevels = [$('#qual').value];
  if($('#mode').value) p.studyModes = [$('#mode').value];
  if($('#region').value) p.regions = [$('#region').value];
  // Several universities are ORed together by the API, so a shortlist comes
  // back as one comparable table.
  if(PICKED.length) p.providers = PICKED.map(x=>x.value);
  return p;
}

async function search(){
  const btn = $('#go'); btn.disabled = true;
  $('#cStat').textContent = 'searching…';
  $('#out').innerHTML = '<div class="load">Fetching from UCAS…</div>';
  progress(20);
  try{
    const p = payload();
    const pages = parseInt($('#depth').value,10);
    const data = await post('/api/bulk', Object.assign({}, p, {limit: pages*100}));
    progress(80);
    ROWS = data.courses || [];
    const total = data.total;
    $('#cStat').innerHTML = '<b>'+ROWS.length+'</b> loaded of <b>'+(total==null?'?':total.toLocaleString())+'</b> matches'
      + (data.timedOut ? ' <span style="color:var(--warn)">(partial — narrow the search for full coverage)</span>' : '');

    // Warn when the requested cycle simply isn't published by UCAS yet.
    const y = $('#year').value;
    const note = $('#note');
    // A new cycle has no tariff data for months, so borrow last year's for
    // the same course. Clearly marked in the table, never silently merged.
    let borrowed = 0;
    if(ROWS.length && ROWS.every(r => !r.tariff)){
      borrowed = await borrowTariffs(p);
    }

    // Flag a thin result set, or a cycle whose entry requirements are not
    // published yet — otherwise the empty Tariff column just looks broken.
    const noTariff = ROWS.length > 20 && ROWS.every(r => !r.tariff);
    if(total != null && total > 0 && total < 200){
      note.hidden = false;
      note.innerHTML = '<b>Heads up:</b> only '+total.toLocaleString()+' courses match — '+
        'this cycle or filter combination may not be fully published yet.';
    } else if(borrowed){
      const grades = ROWS.filter(r=>r.tariffIsGrades).length;
      note.hidden = false;
      note.innerHTML = '<b>Showing previous entry requirements.</b> '+y+' grades are not published '+
        'yet — universities list courses long before they finalise them — so '+
        borrowed.toLocaleString()+' of '+ROWS.length.toLocaleString()+' rows show earlier data, '+
        'marked <span class="tar prev">dimmed with a ~</span>. ' +
        (grades ? 'Selective universities (UCL, Oxford, Cambridge) quote <b>A-level grades</b> rather '+
                  'than tariff points, so '+grades.toLocaleString()+' rows show grades like AAB. ' : '') +
        'Treat them as a guide, not a promise.';
    } else if(noTariff){
      note.hidden = false;
      note.innerHTML = '<b>No tariff data for '+(y||'this year')+' yet.</b> Universities publish '+
        'course listings before they finalise entry requirements, so the Tariff column is empty. '+
        'Switch to <b>2026</b> to see typical grades for the same courses.';
    } else { note.hidden = true; }

    render();
  }catch(e){
    $('#out').innerHTML = '<div class="empty">Error: '+e.message+'</div>';
    $('#cStat').textContent = 'error';
  }finally{ btn.disabled=false; progress(100); }
}

// Fill empty tariffs from the previous cycle, matching on courseId (stable
// across years) and falling back to provider+title. Returns how many rows
// were filled. Borrowed values are flagged so the table can mark them.
async function borrowTariffs(p){
  const providers = [...new Set(ROWS.map(r=>r.provider).filter(Boolean))];
  if(!providers.length) return 0;
  try{
    const d = await post('/api/tariffs', {
      academicYearId: p.academicYearId,
      studyLevel: p.studyLevel,
      providers: providers,
    });
    const byId = d.tariffs || {}, byTitle = d.byTitle || {};
    const gId = d.grades || {}, gTitle = d.gradesByTitle || {};
    const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
    let n = 0;
    for(const r of ROWS){
      if(r.tariff) continue;
      const k = r.provider+'|'+norm(r.title);
      const hit = byId[r.id] || byTitle[k];
      if(hit){ r.tariff = hit; r.tariffFrom = d.year; n++; continue; }
      // Selective universities publish A-level grades, not tariff points.
      const g = gId[r.id] || gTitle[k];
      if(g){ r.tariff = g; r.tariffFrom = d.gradesFrom || 'recent years'; r.tariffIsGrades = true; n++; }
    }
    return n;
  }catch(e){ return 0; }
}

function tariffNum(t){
  if(!t) return null;
  const m = String(t).match(/\d+/g);
  return m ? Math.min.apply(null, m.map(Number)) : null;
}

function visible(){
  // The shortlist is applied server-side, so no client-side provider filter
  // is needed; the text box is only a search field for the picker.
  const fp = '';
  const fs=$('#fsub').value.toLowerCase(),
        ft=$('#ftown').value.toLowerCase(), mt=parseInt($('#ftar').value,10);
  let rows = ROWS.filter(r=>{
    if(fp && (r.provider||'').toLowerCase() !== fp) return false;
    if(fs && !((r.subjects||[]).join(' ')+' '+(r.subjectText||'')+' '+(r.title||'')).toLowerCase().includes(fs)) return false;
    if(ft && !((r.town||'')+' '+(r.region||'')).toLowerCase().includes(ft)) return false;
    // Only apply the tariff floor to rows that actually carry tariff points.
    // Cycles without published requirements, and grade values like "AAB",
    // would otherwise be filtered out on a number they do not have.
    if(!isNaN(mt) && !r.tariffIsGrades){
      const t=tariffNum(r.tariff); if(t != null && t<mt) return false;
    }
    return true;
  });
  const k=SORT.key, d=SORT.dir;
  rows.sort((a,b)=>{
    let x,y;
    if(k==='tariff'){ x=tariffNum(a.tariff); y=tariffNum(b.tariff);
      if(x==null) return 1; if(y==null) return -1; return (x-y)*d; }
    x=(a[k]||'').toString().toLowerCase(); y=(b[k]||'').toString().toLowerCase();
    return x<y?-d:x>y?d:0;
  });
  return rows;
}

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const rows = visible();
  VIEW = rows;
  if(!rows.length){
    $('#out').innerHTML='<div class="empty">No courses match those filters.</div>';
    closePanel();
    return;
  }
  // Location is gone: town and region live in the side panel, and dropping the
  // column buys the width that keeps course titles on one line.
  const cols = [['title','Course'],['provider','University'],
                ['tariff','Tariff'],['award','Award'],['duration','Len'],['start','Start']];
  let h = '<table><thead><tr>';
  cols.forEach(([k,label])=>{
    h += '<th data-k="'+k+'" class="'+(SORT.key===k?'sorted':'')+'">'+label+
         (SORT.key===k?(SORT.dir>0?' ▲':' ▼'):'')+'</th>';
  });
  h += '<th class="c-link" title="Open on UCAS"></th></tr></thead><tbody>';
  rows.forEach((r,i)=>{
    const code = r.applicationCode ? ' <span class="tag">'+esc(r.applicationCode)+'</span>' : '';
    h += '<tr data-i="'+i+'">'
      + '<td class="c-title"><span class="ttl">'+esc(r.title)+'</span>'+code+'</td>'
      + '<td class="c-prov prov">'+esc(r.provider)+'</td>'
      + '<td class="tar'+(r.tariffFrom?' prev':'')+'" title="'+(r.tariffFrom?((r.tariffIsGrades?'A-level grades from ':'from ')+r.tariffFrom+(r.tariffIsGrades?'':' entry')):'')+'">'+(r.tariffFrom?'~':'')+esc(r.tariff||'—')+'</td>'
      + '<td class="mini">'+esc(r.award||'')+'</td>'
      + '<td class="mini">'+esc(r.duration||'')+'</td>'
      + '<td class="mini">'+esc(r.start||'')+'</td>'
      + '<td class="c-link">'+(r.ucasUrl
          ? '<a class="ext" href="'+esc(r.ucasUrl)+'" target="_blank" rel="noopener" title="Open UCAS listing in a new tab">↗</a>'
          : '')+'</td>'
      + '</tr>';
  });
  h += '</tbody></table>';
  $('#out').innerHTML = h;

  $('#out').querySelectorAll('thead th[data-k]').forEach(th=>{
    th.onclick = ()=>{ const k=th.dataset.k;
      if(SORT.key===k) SORT.dir*=-1; else {SORT.key=k;SORT.dir=1;}
      render(); };
  });
  $('#out').querySelectorAll('tbody tr').forEach(tr=>{
    tr.onclick = (e)=>{
      // Let the external link do its own thing rather than also opening the panel.
      if(e.target.closest('a.ext')) return;
      open_(+tr.dataset.i);
    };
  });
  // Keep the open course highlighted across a re-sort, and follow it if its
  // position moved.
  if(SEL){
    const at = rows.findIndex(r=>r===SEL);
    if(at >= 0){ CUR = at; mark(); } else closePanel();
  }
}

// ---- Side panel ------------------------------------------------------
// VIEW is the rows currently on screen, CUR the index of the open one and SEL
// the row object itself, so a re-sort can follow the selection.
let VIEW = [], CUR = -1, SEL = null;

function mark(){
  const body = $('#out').querySelector('tbody');
  if(!body) return;
  body.querySelectorAll('tr.sel').forEach(tr=>tr.classList.remove('sel'));
  const tr = body.querySelector('tr[data-i="'+CUR+'"]');
  if(tr){
    tr.classList.add('sel');
    tr.scrollIntoView({block:'nearest'});
  }
  $('#ppos').textContent = VIEW.length ? (CUR+1)+' of '+VIEW.length.toLocaleString() : '';
  $('#pprev').disabled = CUR <= 0;
  $('#pnext').disabled = CUR >= VIEW.length-1;
}

function open_(i){
  if(i < 0 || i >= VIEW.length) return;
  CUR = i; SEL = VIEW[i];
  fill(SEL);
  $('#panel').classList.add('open');
  $('#panel').setAttribute('aria-hidden','false');
  document.querySelector('main').classList.add('split');
  mark();
}

function closePanel(){
  $('#panel').classList.remove('open');
  $('#panel').setAttribute('aria-hidden','true');
  document.querySelector('main').classList.remove('split');
  const body = $('#out').querySelector('tbody');
  if(body) body.querySelectorAll('tr.sel').forEach(tr=>tr.classList.remove('sel'));
  SEL = null; CUR = -1;
}

function row(dt, dd){
  return dd ? '<dt>'+dt+'</dt><dd>'+esc(dd)+'</dd>' : '';
}

function fill(r){
  $('#ptitle').textContent = r.title || '';
  $('#pprov').textContent = r.provider || '';

  const ucas = $('#pucas');
  if(r.ucasUrl){ ucas.href = r.ucasUrl; ucas.hidden = false; } else ucas.hidden = true;
  const web = $('#pweb');
  // Two thirds of provider URLs arrive without a scheme ("www.dur.ac.uk"),
  // which a browser treats as a relative path and resolves against this site.
  let site = r.providerWebsite || r.courseUrl || '';
  if(site && !/^https?:\/\//i.test(site)) site = 'https://' + site.replace(/^\/+/, '');
  if(site){ web.href = site; web.hidden = false; } else web.hidden = true;

  // Entry requirement first and large — it is the thing being compared.
  let h = '<div class="pbox">'
    + '<div class="biglab">'
    + (r.tariffIsGrades ? 'A-level grades' : 'UCAS tariff')
    + (r.tariffFrom ? ' · from '+esc(r.tariffFrom) : '')
    + '</div>'
    + '<div class="big'+(r.tariffFrom?' prev':'')+'">'
    + (r.tariffFrom?'~':'') + esc(r.tariff || '—') + '</div>'
    + (r.tariffFrom
        ? '<div class="sub">Not published for '+esc(r.year)+' yet — shown from '
          + esc(r.tariffFrom)+'. Check the UCAS listing.</div>'
        : '')
    + '</div>';

  const extra = [['A level',r.aLevel],['BTEC',r.btec],['IB',r.ib],
                 ['Scottish Higher',r.scottishHigher]]
    .filter(x=>x[1]).map(x=>row(esc(x[0]),x[1])).join('');
  if(extra) h += '<p class="psec">Other qualifications</p><dl class="kv">'+extra+'</dl>';

  h += '<p class="psec">Course</p><dl class="kv">'
    + row('Award', r.awardFull || r.award)
    + row('Code', r.applicationCode)
    + row('Duration', r.duration)
    + row('Mode', r.studyMode)
    + row('Starts', r.start)
    + row('Entry', (r.entryPoints||[]).join(', '))
    + row('Year', r.year)
    + '</dl>';

  const where = [r.town, r.region, r.country].filter(Boolean).join(', ');
  h += '<p class="psec">Location</p><dl class="kv">'
    + row('Campus', where)
    + row('Postcode', r.postcode)
    + '</dl>';
  if(r.lat && r.lng){
    h += '<div style="margin-top:7px"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='
      + r.lat + ',' + r.lng + '">View on map ↗</a></div>';
  }

  const subj = r.subjectText || (r.subjects||[]).join(', ');
  if(subj) h += '<p class="psec" style="margin-top:14px">Subjects</p><div class="sub">'+esc(subj)+'</div>';

  if(r.summary) h += '<p class="psec" style="margin-top:14px">Summary</p><div class="sub">'+esc(r.summary)+'</div>';

  $('#pbody').innerHTML = h;
  $('#pbody').scrollTop = 0;
}

$('#pclose').onclick = closePanel;
$('#pprev').onclick = ()=>open_(CUR-1);
$('#pnext').onclick = ()=>open_(CUR+1);

// Arrow keys walk the list while the panel is open, so browsing is one hand.
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && SEL){ closePanel(); return; }
  if(!SEL) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); open_(CUR+1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); open_(CUR-1); }
});

function csv(){
  const rows = visible();
  if(!rows.length) return;
  const cols = ['title','provider','providerCode','applicationCode','town','region','country',
                'tariff','tariffFrom','aLevel','btec','ib','award','duration','studyMode','start','year','courseUrl'];
  const out = [cols.join(',')].concat(rows.map(r=>cols.map(c=>{
    const v = r[c]==null?'':String(r[c]).replace(/"/g,'""').replace(/\s+/g,' ');
    return '"'+v+'"';
  }).join(',')));
  const blob = new Blob([out.join('\n')],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ucas-courses.csv';
  a.click();
}

// ---- Provider picker -------------------------------------------------------
// UCAS institution names are not guessable ("UCL (University College London)",
// "Manchester Metropolitan University (MMU)"), so this is a searchable list
// rather than a text field. The server pairs each display name with the value
// the API's provider filter actually matches.
// PICKED holds every selected university; the API ORs them together, so a
// shortlist can be compared side by side in one table.
let PROVIDERS = [], PICKED = [], ACTIVE = -1;

async function loadProviders(){
  try{
    // Scope the list to the selected cycle, so counts match what a search
    // will actually return and providers absent that year do not appear.
    const d = await post('/api/providers', {
      studyLevel: 'Undergraduate',
      academicYearId: $('#year').value || undefined,
    });
    PROVIDERS = d.providers || [];
    // Drop any selection that no longer exists in this cycle.
    const live = new Set(PROVIDERS.map(p=>p.name));
    const before = PICKED.length;
    PICKED = PICKED.filter(p=>live.has(p.name));
    if(PICKED.length !== before) renderChips();
  }catch(e){ /* picker degrades to a plain filter box */ }
}

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

function markup(text, term){
  if(!term) return esc(text);
  const re = new RegExp('('+escRe(term)+')','ig');
  return esc(text).replace(re, '<mark>$1</mark>');
}

function matches(term){
  if(!PROVIDERS.length) return [];
  const t = term.trim().toLowerCase();
  if(!t) return PROVIDERS.slice(0, 80);
  // Search display name AND alias, so "MMU" or "LSBU" finds the institution.
  const hits = PROVIDERS.filter(p =>
    p.name.toLowerCase().includes(t) || p.value.toLowerCase().includes(t));
  // Prefer names that start with the term, then shorter names.
  hits.sort((a,b)=>{
    const as=a.name.toLowerCase().startsWith(t), bs=b.name.toLowerCase().startsWith(t);
    if(as!==bs) return as?-1:1;
    return a.name.length-b.name.length;
  });
  return hits.slice(0, 80);
}

function openMenu(term){
  const list = matches(term);
  const box = $('#provlist');
  ACTIVE = -1;
  if(!list.length){
    box.innerHTML = '<div class="none">No university matches “'+esc(term)+'”.</div>';
  } else {
    const picked = new Set(PICKED.map(x=>x.name));
    box.innerHTML = list.map((p,i)=>{
      // Show the alias only when it adds something (abbreviations etc).
      const extra = p.value !== p.name
        ? '<span class="alias">'+markup(p.value, term)+'</span>' : '';
      return '<div class="opt'+(picked.has(p.name)?' picked':'')+'" role="option" '+
             'aria-selected="'+picked.has(p.name)+'" data-i="'+i+'">'
        + '<span class="nm">'+markup(p.name, term)+extra+'</span>'
        + '<span class="ct">'+p.count.toLocaleString()+'</span></div>';
    }).join('');
    box.querySelectorAll('.opt').forEach(el=>{
      el.onmousedown = e => { e.preventDefault(); choose(list[+el.dataset.i]); };
    });
  }
  box.hidden = false;
  $('#fprov').setAttribute('aria-expanded','true');
  box._list = list;
}

function closeMenu(){
  $('#provlist').hidden = true;
  $('#fprov').setAttribute('aria-expanded','false');
  ACTIVE = -1;
}

function renderChips(){
  const box = $('#provChips');
  box.innerHTML = PICKED.map((p,i)=>
    '<span class="pchip"><span class="nm">'+esc(p.name)+'</span>'+
    '<span class="n">'+p.count.toLocaleString()+'</span>'+
    '<button data-i="'+i+'" title="Remove">×</button></span>').join('');
  box.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ PICKED.splice(+b.dataset.i,1); renderChips(); search(); };
  });
  $('#fprov').classList.toggle('selected', PICKED.length>0);
  $('#fprovClear').hidden = PICKED.length===0;
  $('#fprov').placeholder = PICKED.length ? 'add another…' : 'any university…';
}

// Toggle a university in or out of the shortlist.
function choose(p){
  if(!p) return;
  const at = PICKED.findIndex(x=>x.name===p.name);
  if(at >= 0) PICKED.splice(at,1); else PICKED.push(p);
  $('#fprov').value = '';
  renderChips();
  closeMenu();
  // Changing the shortlist changes the query scope, not just the view, so
  // re-run rather than filtering whatever happened to be loaded.
  search();
}

function clearProviders(){
  PICKED = [];
  $('#fprov').value = '';
  renderChips();
  search();
}

function moveActive(delta){
  const box = $('#provlist');
  const opts = box.querySelectorAll('.opt');
  if(!opts.length) return;
  ACTIVE = (ACTIVE + delta + opts.length) % opts.length;
  opts.forEach((el,i)=>el.classList.toggle('active', i===ACTIVE));
  const el = opts[ACTIVE];
  if(el) el.scrollIntoView({block:'nearest'});
}

$('#fprov').addEventListener('focus', e=>openMenu(e.target.value));
$('#fprov').addEventListener('input', e=>openMenu(e.target.value));
$('#fprov').addEventListener('blur', ()=>setTimeout(closeMenu, 120));
$('#fprov').addEventListener('keydown', e=>{
  const open = !$('#provlist').hidden;
  if(e.key==='ArrowDown'){ e.preventDefault(); if(!open) openMenu($('#fprov').value); else moveActive(1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); moveActive(-1); }
  else if(e.key==='Enter'){
    const list = $('#provlist')._list || [];
    if(open && ACTIVE>=0 && list[ACTIVE]){ e.preventDefault(); choose(list[ACTIVE]); }
    else if(open && list.length===1){ e.preventDefault(); choose(list[0]); }
  }
  else if(e.key==='Escape'){ closeMenu(); }
  // Backspace on an empty box removes the last chip, as in any tag input.
  else if(e.key==='Backspace' && !$('#fprov').value && PICKED.length){
    PICKED.pop(); renderChips(); search();
  }
});
$('#fprovClear').onclick = ()=>{ clearProviders(); $('#fprov').focus(); };

// When served from a snapshot (the deployed Worker), say how fresh it is so
// nobody mistakes it for live UCAS data.
(async function snapshotAge(){
  try{
    const r = await fetch('/api/meta', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if(!r.ok) return;
    const d = await r.json();
    const keys = Object.keys(d.meta||{}).filter(k=>k.startsWith('snapshot_'));
    if(!keys.length) return;
    const when = new Date(d.meta[keys[0]]);
    const days = Math.floor((Date.now()-when)/86400000);
    const el = document.createElement('span');
    el.className = 'chip';
    el.style.marginLeft = '8px';
    el.title = 'This site serves a fixed snapshot, not live UCAS data';
    el.textContent = 'snapshot ' + when.toISOString().slice(0,10) +
                     (days > 0 ? ' · ' + days + 'd old' : ' · today');
    document.querySelector('header').appendChild(el);
  }catch(e){ /* local server has no snapshot; nothing to show */ }
})();

$('#go').onclick = search;
$('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') search(); });
['#fsub','#ftown','#ftar'].forEach(s=>$(s).addEventListener('input', ()=>{ if(ROWS.length) render(); }));
$('#csv').onclick = csv;
// Reload the picker when the cycle changes: provider counts differ per year,
// and some institutions appear in one cycle but not another.
$('#year').addEventListener('change', loadProviders);

renderChips();
loadProviders();
</script>
</body>
</html>
